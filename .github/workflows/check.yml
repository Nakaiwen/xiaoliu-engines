name: 核對引擎拷貝

on:
  push:
  workflow_dispatch:
  schedule:
    # 每週一 台北時間 09:17（UTC 01:17）
    - cron: '17 1 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
